  <!-- Fallback client-side nạp component nếu chạy qua static web server đơn giản -->
  <script>
    (async function initComponentFallbacks() {
      const comments = [];
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_COMMENT, null, false);
      let node;
      while (node = walker.nextNode()) {
        if (node.nodeValue && node.nodeValue.trim().startsWith('include:')) {
          comments.push(node);
        }
      }
      if (comments.length > 0) {
        for (const c of comments) {
          const file = c.nodeValue.replace('include:', '').trim();
          try {
            const res = await fetch(file);
            if (res.ok) {
              const html = await res.text();
              const temp = document.createElement('div');
              temp.innerHTML = html;
              while (temp.firstChild) {
                c.parentNode.insertBefore(temp.firstChild, c);
              }
              c.remove();
            }
          } catch(e) {
            console.error("Lỗi nạp component fallback:", file, e);
          }
        }
        window.dispatchEvent(new Event('componentsLoaded'));
      }
    })();
  </script>

  <!-- Nạp file script module chính -->
  <script type="module" src="./js/app.js?v=3.1"></script>
