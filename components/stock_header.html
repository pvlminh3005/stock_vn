<!-- Quick Header: Stock Price, Exchange, Range & Live Info -->
<div id="quickHeader"
  class="mt-4 p-4 md:p-5 bg-slate-950/80 border border-slate-800 rounded-xl flex flex-wrap items-center justify-between gap-4">
  <div class="flex items-center gap-3">
    <span id="displayTicker"
      class="text-3xl md:text-4xl font-black font-mono text-white tracking-wider">---</span>
    <div>
      <div id="companyName" class="text-sm md:text-base font-bold text-slate-200">Vui lòng chọn hoặc nhập mã chứng
        khoán</div>
      <div class="flex flex-wrap items-center gap-2 mt-1">
        <span id="exchangeBadge"
          class="text-xs text-blue-400 bg-blue-950/60 border border-blue-900/60 px-2 py-0.5 rounded font-mono font-semibold">HOSE</span>
        <span id="sectorBadge" class="text-xs text-slate-300 bg-slate-800/80 px-2 py-0.5 rounded">Ngành:
          ---</span>
        <span id="updateTime" class="text-xs text-slate-400 font-mono">Phiên: --/--/----</span>
      </div>
    </div>
  </div>

  <div class="flex items-center gap-4 sm:gap-6">
    <!-- Bảng giá Cao nhất / Tham chiếu / Thấp nhất -->
    <div class="hidden sm:flex flex-col text-right font-mono text-xs space-y-0.5">
      <div><span class="text-slate-500">Cao nhất:</span> <span id="priceHigh"
          class="text-emerald-400 font-semibold">--</span></div>
      <div><span class="text-slate-500">Tham chiếu:</span> <span id="priceRef"
          class="text-amber-300 font-semibold">--</span></div>
      <div><span class="text-slate-500">Thấp nhất:</span> <span id="priceLow"
          class="text-rose-400 font-semibold">--</span></div>
    </div>

    <!-- Giá khớp & Biến động -->
    <div class="text-right">
      <div class="text-xs text-slate-400 mb-0.5">Giá khớp lệnh</div>
      <div id="currentPrice" class="text-2xl md:text-3xl font-extrabold font-mono text-blue-400">--</div>
      <div id="priceChangeBadge"
        class="inline-block mt-1 text-xs font-bold px-2.5 py-0.5 rounded bg-slate-800 text-slate-400">--</div>
    </div>
  </div>
</div>
