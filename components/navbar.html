<!-- Top Bar: Logo, Search Bar & Quick Ticker Chips -->
<div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
  <div>
    <div class="flex items-center gap-2">
      <span class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
        <i class="fa-solid fa-chart-line text-lg"></i>
      </span>
      <h1 class="text-xl md:text-2xl font-black text-white tracking-wide">
        Stock Pro Analytics <span
          class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 ml-1">v2.0</span>
      </h1>
    </div>
    <p class="text-xs text-slate-400 mt-1">Đánh giá sức khỏe doanh nghiệp (FA) kết hợp dòng tiền xung lực T+ (TA
      &amp; Volume)</p>
  </div>

  <!-- Search Bar & Chế độ xem -->
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5 relative w-full lg:w-auto">
    <!-- Mode Switcher Tabs (Thanh trượt mượt trên Mobile, tối ưu touch target 44px) -->
    <div
      class="inline-flex rounded-xl bg-slate-950 p-1 border border-slate-800 text-xs font-semibold w-full sm:w-auto overflow-x-auto smooth-horizontal-scroll">
      <button type="button" id="modeSingleStockBtn"
        class="mode-nav-btn min-h-[44px] flex-1 sm:flex-initial px-3 sm:px-3.5 py-2 rounded-lg transition bg-blue-600 text-white shadow-sm flex items-center justify-center gap-1.5 active cursor-pointer whitespace-nowrap">
        <i class="fa-solid fa-chart-simple text-xs"></i> <span>Tra Cứu 1 Mã</span>
      </button>
      <button type="button" id="modePortfolioBundleBtn"
        class="mode-nav-btn min-h-[44px] flex-1 sm:flex-initial px-3 sm:px-3.5 py-2 rounded-lg transition text-slate-400 hover:text-white flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap">
        <i class="fa-solid fa-briefcase text-xs text-amber-400"></i> <span>Gói Theo Vốn</span>
        <span
          class="text-[10px] px-1.5 py-0.2 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">Mới</span>
      </button>
      <button type="button" id="modeUserPortfolioBtn"
        class="mode-nav-btn min-h-[44px] flex-1 sm:flex-initial px-3 sm:px-3.5 py-2 rounded-lg transition text-slate-400 hover:text-white flex items-center justify-center gap-1.5 cursor-pointer whitespace-nowrap">
        <i class="fa-solid fa-book-bookmark text-xs text-emerald-400"></i> <span>Sổ Lệnh 💼</span>
      </button>
    </div>

    <!-- Search Input Wrapper -->
    <div id="singleStockSearchWrapper" class="flex items-center gap-2 relative w-full sm:w-auto flex-1">
      <div class="relative flex-1 sm:w-64 md:w-72 lg:w-80">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </div>
        <input type="text" id="tickerInput" placeholder="Nhập mã CP (HPG, FPT, VCB)..." autocomplete="off"
          class="w-full min-h-[44px] bg-slate-950 border border-slate-700/80 rounded-xl pl-9 pr-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 uppercase font-mono tracking-wider transition shadow-inner">
        <!-- Autocomplete suggestions dropdown (rộng rãi, chống tràn dòng trên mobile) -->
        <div id="searchSuggestions"
          class="hidden absolute top-full left-0 w-full sm:w-[420px] md:w-[460px] max-w-[calc(100vw-32px)] mt-1.5 bg-slate-900/98 border border-slate-700/80 rounded-xl shadow-2xl z-50 divide-y divide-slate-800/80 text-xs max-h-80 overflow-y-auto backdrop-blur-md">
        </div>
      </div>

      <button id="searchBtn" type="button"
        class="min-h-[44px] min-w-[44px] bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 whitespace-nowrap shadow-lg shadow-blue-600/20 cursor-pointer">
        <i class="fa-solid fa-sync" id="searchIcon"></i> Tra cứu
      </button>

      <!-- <button id="lockAppBtn" type="button" title="Khóa ứng dụng & Đăng xuất"
        class="bg-slate-950 hover:bg-slate-800 border border-slate-700/80 text-slate-400 hover:text-amber-400 px-3 py-2 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer shadow-inner">
        <i class="fa-solid fa-lock text-xs"></i>
      </button> -->
    </div>
  </div>
</div>
