<!-- Top Bar: Logo, Search Bar & Quick Ticker Chips -->
<div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
  <div>
    <div class="flex items-center gap-2">
      <span class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
        <i class="fa-solid fa-chart-line text-lg"></i>
      </span>
      <h1 class="text-xl md:text-2xl font-black text-white tracking-wide">
        Stock Pro Analytics <span
          class="text-xs font-semibold px-2 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30 ml-1">v2.0</span>
      </h1>
    </div>
    <p class="text-xs text-slate-400 mt-1">Đánh giá sức khỏe doanh nghiệp (FA) kết hợp dòng tiền xung lực T+ (TA
      &amp; Volume)</p>
  </div>

  <!-- Search Bar -->
  <div class="flex items-center gap-2 relative w-full sm:w-auto">
    <div class="relative w-full sm:w-72 md:w-80 lg:w-96">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <i class="fa-solid fa-magnifying-glass text-xs"></i>
      </div>
      <input type="text" id="tickerInput" placeholder="Nhập mã CP (HPG, FPT, VCB, SSI)..." autocomplete="off"
        class="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-9 pr-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 uppercase font-mono tracking-wider transition shadow-inner">
      <!-- Autocomplete suggestions dropdown (rộng rãi, chống tràn dòng) -->
      <div id="searchSuggestions"
        class="hidden absolute top-full left-0 w-full sm:w-[420px] md:w-[460px] mt-1.5 bg-slate-900/98 border border-slate-700/80 rounded-xl shadow-2xl z-50 divide-y divide-slate-800/80 text-xs max-h-80 overflow-y-auto backdrop-blur-md">
      </div>
    </div>

    <button id="searchBtn" type="button"
      class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white px-5 py-2.5 rounded-xl text-sm font-semibold transition flex items-center justify-center gap-2 whitespace-nowrap shadow-lg shadow-blue-600/20 cursor-pointer">
      <i class="fa-solid fa-sync" id="searchIcon"></i> Tra cứu
    </button>
  </div>
</div>
